name: Generate draft

on:
  schedule:
    # Weekly: Monday 06:00 UTC — adjust as needed
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "generate or resend"
        type: choice
        options:
          - generate
          - resend
        default: generate
      post_id:
        description: "Required for resend — pending post id"
        type: string
        required: false

permissions:
  contents: write
  models: read

concurrency:
  group: generate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - name: Check required secrets
        id: check
        shell: bash
        env:
          # Secret-dependent values are empty in forks unless users configure them.
          TELEGRAM_POST_BOT_TOKEN: ${{ secrets.TELEGRAM_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=()
          [[ -z "${TELEGRAM_POST_BOT_TOKEN}" ]] && missing+=("TELEGRAM_POST_BOT_TOKEN")
          [[ -z "${TELEGRAM_CHAT_ID}" ]] && missing+=("TELEGRAM_CHAT_ID")

          if (( ${#missing[@]} > 0 )); then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping generation. Missing secrets: ${missing[*]}"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

  generate_draft:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WF_ACTION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action || 'generate' }}
      WF_POST_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.post_id || '' }}
      # Secret-dependent values are empty in forks unless users configure them.
      TELEGRAM_POST_BOT_TOKEN: ${{ secrets.TELEGRAM_POST_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_LOG_BOT_TOKEN: ${{ secrets.TELEGRAM_LOG_BOT_TOKEN }}
      TELEGRAM_LOG_CHAT_ID: ${{ secrets.TELEGRAM_LOG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generation script
        run: python scripts/generate.py

  generate_skipped:
    needs: preflight
    if: needs.preflight.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip summary
        run: echo "Generation skipped due to missing secrets: ${{ needs.preflight.outputs.missing }}"
